<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diet Plan - Vada Pav</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 15px;
            padding: 50px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 30px;
            font-weight: 700;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 40px;
            font-size: 1.1em;
            border-radius: 25px;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            font-weight: 600;
            margin-top: 20px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .content {
            display: none;
            margin-top: 30px;
            animation: fadeIn 0.5s ease-in;
        }

        .content.show {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .question {
            color: #667eea;
            font-size: 1.3em;
            margin-bottom: 20px;
            font-weight: 600;
            line-height: 1.5;
        }

        .answer {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 10px;
            color: #333;
            font-size: 1.1em;
            margin-top: 20px;
            border-left: 4px solid #667eea;
        }

        .protein-info {
            color: #764ba2;
            font-weight: 700;
            font-size: 1.2em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Get Diet Plan</h1>
        <button onclick="showContent()">Here</button>

        <div id="content" class="content">
            <div class="question">
                Kya diet vada pav ka usmein bhi protein hai
            </div>
            <div class="answer">
                <p>Right! Vada pav has how much protein:</p>
                <p class="protein-info">Approximately 8-10g of protein per serving</p>
                <p style="margin-top: 15px; font-size: 0.95em; color: #666;">
                    Vada pav is made with chickpea flour (besan) and potato, which provides a decent amount of protein, making it a moderately protein-rich Indian snack.
                </p>
            </div>
        </div>
    </div>

    <script>
        function showContent() {
            const content = document.getElementById('content');
            const heading = document.querySelector('h1');
            const button = document.querySelector('button');
            
            content.classList.toggle('show');
            heading.style.display = content.classList.contains('show') ? 'none' : 'block';
            button.style.display = content.classList.contains('show') ? 'none' : 'block';
        }
    </script>
</body>
</html>
